openapi: 3.0.3
info:
  title: Latch agent (latchd) management API
  version: 0.1.0
  description: >-
    Local management API for the Latch agent. Loopback-only unless a
    management password is set. Mutating requests require a session and a
    CSRF token when authentication is enabled; cross-origin mutations are
    always refused.
servers:
  - url: http://127.0.0.1:4040
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: latch_session
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
    Object:
      type: object
      additionalProperties: true
security:
  - sessionCookie: []
paths:
  /api/auth/login:
    post:
      summary: POST /api/auth/login
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Object'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Object'}}}}
        '400': {description: Bad request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Authentication required}
        '403': {description: Forbidden (CSRF or cross-origin)}
  /api/auth/logout:
    post:
      summary: POST /api/auth/logout
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Object'}
