<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latch</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem;color:#1f2933}
 h1{font-size:1.4rem} label{display:block;font-size:.85rem;margin:.6rem 0 .2rem}
 input{width:100%;padding:.5rem;border:1px solid #cbd2d9;border-radius:6px;box-sizing:border-box}
 button{margin-top:.8rem;padding:.5rem .9rem;background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
 button.ghost{background:#fff;color:#2563eb;border:1px solid #2563eb}
 .card{border:1px solid #e4e7eb;border-radius:10px;padding:1rem;margin:1rem 0}
 .err{color:#c0392b;font-size:.9rem} code{background:#f0f2f5;padding:.1rem .3rem;border-radius:4px;word-break:break-all}
 .row{display:flex;gap:.5rem} .muted{color:#7b8794;font-size:.85rem}
</style></head>
<body>
<h1>Latch</h1>
<div id="app"></div>
<script>
let csrf = "";
async function api(method, path, body){
  const h = {}; if(body) h["Content-Type"]="application/json";
  if(method!=="GET" && csrf) h["X-CSRF-Token"]=csrf;
  const r = await fetch("/api"+path,{method,headers:h,body:body?JSON.stringify(body):undefined,credentials:"same-origin"});
  const t = await r.text(); const d = t?JSON.parse(t):null;
  if(!r.ok) throw new Error(d&&d.error||r.statusText);
  return d;
}
const el = s => { const d=document.createElement("div"); d.innerHTML=s; return d; };
const app = document.getElementById("app");

async function boot(){
  try { const me = await api("GET","/me"); csrf = me.csrfToken; dashboard(me); }
  catch { authView(); }
}

function authView(mode="login"){
  app.innerHTML="";
  const c = el(`<div class="card">
    <div class="row"><button id="tl" class="${mode==='login'?'':'ghost'}">Sign in</button>
    <button id="ts" class="${mode==='signup'?'':'ghost'}">Sign up</button></div>
    <label>Email</label><input id="email" type="email">
    <label>Password</label><input id="pw" type="password">
    ${mode==='signup'?'<label>Account name</label><input id="acct">':''}
    ${mode==='login'?'<label>2FA code (if enabled)</label><input id="totp">':''}
    <button id="go">${mode==='signup'?'Create account':'Sign in'}</button>
    <p class="err" id="err"></p></div>`);
  app.appendChild(c);
  document.getElementById("tl").onclick=()=>authView("login");
  document.getElementById("ts").onclick=()=>authView("signup");
  document.getElementById("go").onclick=async()=>{
    const email=document.getElementById("email").value, pw=document.getElementById("pw").value;
    try{
      if(mode==='signup'){ await api("POST","/signup",{email,password:pw,accountName:document.getElementById("acct").value}); }
      else{ const r=await api("POST","/login",{email,password:pw,totp:document.getElementById("totp").value});
            if(r&&r.mfaRequired){ document.getElementById("err").textContent="Enter your 2FA code."; return; } }
      boot();
    }catch(e){ document.getElementById("err").textContent=e.message; }
  };
}

async function dashboard(me){
  app.innerHTML="";
  const tokens = await api("GET","/tokens");
  const c = el(`<div class="card">
    <p>Signed in to <b>${me.account.name}</b> <span class="muted">(${me.account.region}, ${me.account.status})</span>
      <button id="out" class="ghost" style="float:right">Sign out</button></p></div>
    <div class="card"><h3>Tunnel tokens</h3>
      <div id="toks"></div>
      <label>Name</label><input id="tname" placeholder="laptop">
      <button id="mk">Create token</button>
      <div id="conn"></div><p class="err" id="terr"></p></div>`);
  app.appendChild(c);
  const toks=document.getElementById("toks");
  toks.innerHTML = tokens.length? tokens.map(t=>`<div class="muted">${t.name} · ${t.hostnames&&t.hostnames[0]||''} · ${t.status}</div>`).join(""):'<div class="muted">none yet</div>';
  document.getElementById("out").onclick=async()=>{ await api("POST","/logout"); authView(); };
  document.getElementById("mk").onclick=async()=>{
    try{
      const r=await api("POST","/tokens",{name:document.getElementById("tname").value||"token"});
      document.getElementById("conn").innerHTML=
        `<p>Your.hostname: <code>${r.hostname}</code></p>
         <p>Run this on the machine with your service:</p>
         <p><code>latchd relay add --url "${r.connectionString}"</code></p>
         <p><code>latchd route add --target 127.0.0.1:3000 --tunnel ${r.token.name} --hostname ${r.hostname}</code></p>`;
      dashboard(me);
    }catch(e){ document.getElementById("terr").textContent=e.message; }
  };
}
boot();
</script>
</body></html>
