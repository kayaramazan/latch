run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - misspell
    - gosec
    - bodyclose
    - noctx

linters-settings:
  gosec:
    excludes:
      - G304 # file inclusion via variable: config/cert paths are user-provided by design
