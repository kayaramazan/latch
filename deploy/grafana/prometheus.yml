# Example Prometheus scrape config for Latch.
# The relay exposes /metrics on its metrics-addr (default 127.0.0.1:7070);
# the agent exposes /metrics on its management API (default 127.0.0.1:4040).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: latch-relay
    static_configs:
      - targets: ["127.0.0.1:7070"]
  - job_name: latchd
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4040"]
