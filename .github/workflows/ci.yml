name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect UI
        id: ui
        run: echo "present=$([ -f latch-ui/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.ui.outputs.present == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: latch-ui/pnpm-lock.yaml
      - run: cd latch-ui && pnpm install --frozen-lockfile && pnpm check-i18n && pnpm build && pnpm test
        if: steps.ui.outputs.present == 'true'

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Acceptance scenarios
        run: sh deploy/acceptance/run.sh

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd electron && npm test
